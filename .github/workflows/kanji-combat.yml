name: Kanji Combat Android
on:
  push:
    branches: [kanji-combat-standalone]
    paths:
      - 'kanji-combat/**'
      - '.github/workflows/kanji-combat.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
        working-directory: kanji-combat
      - uses: actions/upload-artifact@v4
        with:
          name: KanjiCombat-APK
          path: kanji-combat/app/build/outputs/apk/debug/app-debug.apk
