name: Kanji Combat Android
on:
  push:
    branches: [kanji-combat-standalone]
    paths:
      - 'kanji-combat/**'
      - '.github/workflows/kanji-combat.yml'
  workflow_dispatch:
concurrency:
  group: kanji-combat-android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35
        shell: bash
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build standalone APK
        run: gradle -p kanji-combat --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KanjiCombat-APK
          path: kanji-combat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
