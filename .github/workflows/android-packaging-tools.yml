name: Android packaging utilities
on:
  push:
    branches: [kanji-combat-standalone]
    paths:
      - '.github/workflows/android-packaging-tools.yml'
  workflow_dispatch:
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK build tools directly
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "build-tools;35.0.0"
          mkdir -p packing
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" packing/
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" packing/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" packing/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" packing/
          chmod +x packing/zipalign packing/apksigner packing/aapt2
      - uses: actions/upload-artifact@v4
        with:
          name: android-packaging-tools
          path: packing/
