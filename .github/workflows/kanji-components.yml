name: Kanji Combat component data
on:
  push:
    branches: [kanji-combat-standalone]
    paths: ['.github/workflows/kanji-components.yml']
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - name: Extract licensed component and stroke mapping
        run: |
          git clone --depth 1 https://github.com/KanjiVG/kanjivg.git /tmp/kanjivg
          git clone --depth 1 https://github.com/evanclan/OpenJLPT.git /tmp/openjlpt
          python - <<'PY'
          import json,pathlib,xml.etree.ElementTree as ET,unicodedata as u
          chars='一七万丈三上下両並中丸久乗九乳事二五交京人今仕休会伯低住体何作使供便個借停傘働元兄先入全八公六円冊再写冬冷出分切初利到前勉動勢勤北匹医十千午半南危卵厚去友取口古台右号同名向吸吹呂味呼咲問喫四回困図国園土地堂塩声売夏夕外多夜大天太夫失奥女好妹姉始婚嫌子字学安官室家宿寒寝封小少局屋山川左差布帯帰帽平年広店度座庫庭廊建弁引弟弱強弾当待後徒御忘忙悪意戸所手押持掃授携撮教散文料新方旅族日早明易映春昨昼時晩晴暇暑暖暗曇曜曲書月有服朝木末本机村来杯東枚果校棚業楽構横橋機次欲歌止歩歯歳死段母毎気水汁汚池泳洋洗海消涼渡温港漢漫濯火灰点無煩熱父牛物犬狭猫玄球理瓶甘生男町画留番疲病痛発登白百皆皿目真眼着知短砂磨礼社祖私秋秒空窓立章符筆筒答箱糖紅紙細終結絵続緑緒締練置習者耳聞肉背脱自色花若英茶荷菓菜葉蔵薄薬行西要見覚親角言計話誌誕語読誰警豚財買貸貼賑質赤走起趣足車転軽辛辞辺近返速週遅遊運道達違遠邪部郵都酒重野金鉄鉛銀鏡長門閉開間関阪降院除階隣雑難雨雪零電青静靴韓音頭頼題願風飛食飯飲飴館駅高魚鳥鳴鶏黄黒鼻馳側未浴又貴巡奇不頂美等直此腹然醤沢処彼油迚派如可縦履為鍵済煙草成椅様箸幾変寸面免宜詰余遣々居愛其掛麗丁故碗'
          ns='{https://kanjivg.tagaini.net/}'
          rad={u.normalize('NFKC',chr(i)): [i-0x2f00+1,u.name(chr(i)).replace('KANGXI RADICAL ','').lower()] for i in range(0x2f00,0x2fd6)}
          meanings={}
          for p in pathlib.Path('/tmp/openjlpt/data/json/kanji').glob('*.json'):
              try:
                  for k in json.loads(p.read_text()):
                      c=k.get('character')
                      if c: meanings[c]=k.get('meanings',[])
              except Exception: pass
          def attr(e,k): return e.get(ns+k) or next((v for a,v in e.attrib.items() if a.endswith('}'+k)),None)
          def strokes(e):
              return [int(x.get('id').rsplit('-s',1)[1])-1 for x in e.iter() if x.tag.endswith('}path') and '-s' in x.get('id','')]
          def node(e):
              c=attr(e,'element')
              return {'c':c,'o':attr(e,'original') or c,'s':strokes(e),'r':attr(e,'radical'),'p':attr(e,'phon'),'pos':attr(e,'position')}
          out={}
          for c in chars:
              p=pathlib.Path('/tmp/kanjivg/kanji')/f'{ord(c):05x}.svg'
              if not p.exists(): continue
              root=ET.parse(p).getroot()
              g=next(x for x in root.iter() if x.tag.endswith('}g') and attr(x,'element')==c)
              allgroups=[node(e) for e in g.iter() if e.tag.endswith('}g') and attr(e,'element') and strokes(e)]
              def direct(e):
                  a=[]
                  for x in e:
                      if x.tag.endswith('}g'):
                          if attr(x,'element'): a.append(node(x))
                          else: a.extend(direct(x))
                  return a
              parts=direct(g)
              if not parts: parts=[node(g)]
              radical=next((x for x in allgroups if x['r']=='general'),None) or next((x for x in allgroups if x['r']=='tradit'),None)
              if not radical and c in rad: radical=node(g)
              if radical and not any(x['c']==radical['c'] and x['s']==radical['s'] for x in parts): parts.append(radical)
              out[c]={'parts':parts,'all':allgroups,'rad':radical}
          pathlib.Path('components.js').write_text('/* KanjiVG CC BY-SA 3.0; OpenJLPT CC BY-SA 4.0; Unicode radical names. */\nwindow.KC_COMPONENTS='+json.dumps(out,ensure_ascii=False,separators=(',',':'))+';\nwindow.KC_RADICALS='+json.dumps(rad,ensure_ascii=False,separators=(',',':'))+';\nwindow.KC_COMPONENT_MEANINGS='+json.dumps(meanings,ensure_ascii=False,separators=(',',':'))+';\n',encoding='utf-8')
          print('Mapped',len(out),'characters; radical labels',len(rad),'meanings',len(meanings))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kanji-components
          path: components.js
