name: Build IN MOTION 2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 35
        shell: bash
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [[ -z "$SDKMGR" ]]; then
            echo "No sdkmanager found"
            exit 1
          fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Setup Python image builder
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate centered, uncropped animated seal
        shell: bash
        run: |
          python -m pip install --quiet pillow numpy
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python scripts/build_seal.py
          test -s app/src/main/assets/seal_centered.webp
          test -s app/src/main/assets/seal_fallback.png
          test -s app/src/main/assets/cover.png
          python -c "from PIL import Image; a=Image.open('app/src/main/assets/seal_centered.webp'); assert a.n_frames >= 60, a.n_frames; assert a.mode == 'RGBA', a.mode; print('Verified animated alpha seal:', a.n_frames, 'frames')"


      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IN_MOTION_2_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
