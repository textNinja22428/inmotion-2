name: Build IN MOTION 2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 35
        shell: bash
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [[ -z "$SDKMGR" ]]; then
            echo "No sdkmanager found"
            exit 1
          fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Setup Python image builder
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare original seal overlay without cropping
        shell: bash
        run: |
          python -m pip install --quiet pillow numpy
          python scripts/build_seal.py
          test -s app/src/main/assets/cover.png
          test -s app/src/main/assets/seal_wide.mp4
          echo "Original seal video and cleaned static poster verified."


      # Maintain one debug signature across subsequent builds so users do not
      # have to uninstall their app on every update. This first transition from
      # older, randomly signed builds requires a verified local data backup.
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: in-motion-debug-signing-v1

      - name: Prepare persistent debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -s "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=IN MOTION Debug, O=IN MOTION, C=TR"
          fi

      - name: Validate app and Worker JavaScript
        shell: bash
        run: |
          node --check app/src/main/assets/app.js
          cp ai-worker/src/index.js /tmp/inmotion-worker.mjs
          node --check /tmp/inmotion-worker.mjs

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IN_MOTION_2_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
