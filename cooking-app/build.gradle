plugins { id 'com.android.application' }
android {
 namespace 'com.cookingrotations.app'
 compileSdk 35
 defaultConfig {
  applicationId 'com.cookingrotations.app'
  minSdk 26
  targetSdk 34
  versionCode 1
  versionName '1.0.0'
 }
 buildTypes { release { minifyEnabled false } }
 androidResources { noCompress += ['mp3','mp4','png'] }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
}
