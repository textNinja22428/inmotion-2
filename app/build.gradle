plugins {
    id 'com.android.application'
}

android {
    namespace 'com.inmotion.personalagenda'
    compileSdk 35

    defaultConfig {
        applicationId 'com.inmotion.personalagenda.v21'
        minSdk 24
        targetSdk 34
        versionCode 24
        versionName '3.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    androidResources {
        noCompress += ['mp3', 'wav', 'mp4']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
