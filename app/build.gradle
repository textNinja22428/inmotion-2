plugins {
    id 'com.android.application'
}

android {
    namespace 'com.inmotion.personalagenda'
    compileSdk 35

    defaultConfig {
        applicationId 'com.inmotion.personalagenda.v21'
        minSdk 24
        targetSdk 34
        versionCode 25
        versionName '3.3.1'
    }

    // GitHub Actions builds must use the same cached key on every run.
    // The default Android debug keystore was being regenerated by AGP,
    // which prevents upgrades while preserving private user data.
    signingConfigs {
        debug {
            if (System.getenv('CI') == 'true') {
                storeFile file("${System.getenv('HOME')}/.android/debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    androidResources {
        noCompress += ['mp3', 'wav', 'mp4']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
