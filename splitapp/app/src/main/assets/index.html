<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
  <meta name="theme-color" content="#09090a"/>
  <title>AM/PM Split</title>
  <style>
:root{color-scheme:dark;--bg:#080809;--ink:#f5f3ee;--muted:#8d8d8f;--accent:#eac945;--line:#343436;--panel:#111112;--panel2:#181819}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}button{font:inherit}button:focus-visible,.session:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.shell{height:100dvh;display:flex;flex-direction:column;padding:12px 17px 10px;gap:11px;background:radial-gradient(ellipse 78% 55% at 110% -30%,#212013 0,transparent 75%),var(--bg)}
.top{display:flex;justify-content:space-between;align-items:center;min-height:50px;gap:10px;padding:0 1px}.branding{display:flex;gap:12px;align-items:center}.emblem{border:1px solid #5b512c;color:var(--accent);height:45px;min-width:45px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;line-height:1;font-size:11px;font-weight:900;letter-spacing:1px}.emblem i{height:1px;background:var(--accent);width:26px;margin:4px}.suptitle{font-size:9px;letter-spacing:2.2px;color:#918977;font-weight:700}.brandcopy h1{font-size:clamp(20px,2.9vw,30px);margin:2px 0 0;font-weight:820;letter-spacing:.9px;line-height:1.05}.brandcopy h1 b{color:var(--accent)}.topright{display:flex;align-items:center;gap:18px;color:#b5b3ae;font-size:10px;letter-spacing:1.4px;font-weight:750;white-space:nowrap}.indicator{border:1px solid #4d4936;padding:8px 12px;border-radius:99px}.dot,.legend-dot{display:inline-block;width:6px;height:6px;border-radius:100%;background:var(--accent);margin-right:7px;box-shadow:0 0 12px #eac94570}
.main{flex:1;display:flex;min-height:0;gap:10px}.board{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid #5a5854;border-radius:13px;overflow:hidden;background:linear-gradient(160deg,#151516,#080809 36%)}.board-caption{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;border-bottom:1px solid var(--line);color:#d9d7d2;font-size:10px;letter-spacing:1.6px;font-weight:800;min-height:35px}.board-caption span:last-child{color:#777672;font-size:9px}.caption-arrow{color:var(--accent)!important;font-size:14px!important}.table-wrap{min-height:0;flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:#59533c transparent}.schedule{border-collapse:collapse;width:100%;height:100%;table-layout:fixed;min-height:280px}.schedule .day-col{width:19%}.schedule th{height:38px;background:#1d1d1e;font-size:15px;color:#fff;font-weight:800;letter-spacing:1px;text-align:left;padding:5px 17px;border-bottom:1px solid #595959}.schedule th:not(:last-child),.schedule td:not(:last-child){border-right:1px solid #39393b}.schedule th small{font-weight:500;font-size:9px;letter-spacing:.3px;color:#8b8988;margin-left:5px}.sun,.moon{color:var(--accent);font-size:19px;margin-right:8px;vertical-align:-1px}.schedule tr td{height:calc((100% - 38px)/7);min-height:38px;border-bottom:1px solid #343436;padding:0}.schedule tbody tr:last-child td{border-bottom:0}.schedule td:first-child{padding:7px 14px 7px 17px;font-weight:750;font-size:clamp(11px,1.55vw,16px);letter-spacing:-.15px}.schedule td .session{background:none;color:var(--ink);border:0;text-align:left;width:100%;height:100%;padding:7px 10px 7px 17px;display:flex;align-items:center;gap:10px;font-size:clamp(11px,1.6vw,17px);font-weight:600;cursor:pointer;line-height:1.25}.schedule td .session:active,.schedule td .session:hover,.schedule td .session.selected{background:rgba(234,201,69,.095)}.schedule td .session.selected{box-shadow:inset 3px 0 var(--accent)}.glyph{width:24px;min-width:24px;display:inline-flex;justify-content:center;align-items:center;font-size:20px;opacity:.9;filter:grayscale(1) brightness(2)}.session .mainname{display:inline-block}.session .mark{color:var(--accent);font-weight:780}.restrow td{background:linear-gradient(90deg,#2b2717,#1b1a13)!important}.restrow .session{color:#f8f5e8;cursor:default}.restrow td:first-child{color:#f9f7ed}.board-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid #393936;font-size:8.5px;letter-spacing:1.1px;color:#9c998f;font-weight:750;white-space:nowrap}
.detail{flex:0 0 0;min-width:0;border:0 solid #55534d;border-radius:13px;background:#111112;overflow:hidden;transition:flex-basis .25s ease,border-width .2s ease;display:flex;flex-direction:column;visibility:hidden}.main.show-detail .detail{flex-basis:47%;border-width:1px;visibility:visible}.main.show-detail .board{flex:1}.main.show-detail .schedule th{font-size:13px}.main.show-detail .schedule td .session{font-size:clamp(10px,1.25vw,13px);gap:4px;padding:6px}.main.show-detail .schedule td:first-child{font-size:11px;padding-left:9px}.main.show-detail .schedule .day-col{width:24%}.main.show-detail .glyph{display:none}.main.show-detail .board-footer span:last-child{display:none}
.detail-top{display:flex;justify-content:space-between;align-items:center;min-height:39px;padding:7px 15px;border-bottom:1px solid var(--line);gap:8px}.back{border:0;background:transparent;color:var(--accent);font-size:10px;font-weight:750;letter-spacing:1.1px;padding:5px 0;cursor:pointer}.micro{font-size:9px;letter-spacing:1.1px;color:#85827a}.detail-scroll{overflow:auto;flex:1;min-height:0;padding:15px 17px 24px;scrollbar-width:thin;scrollbar-color:#59533c transparent}.eyebrow{font-size:10px;color:var(--accent);letter-spacing:1.7px;font-weight:850;margin-bottom:4px}.details-h{font-size:clamp(22px,2.8vw,33px);line-height:1;margin:0 0 7px;font-weight:850;letter-spacing:.3px}.desc{color:#a6a39b;font-size:11px;line-height:1.5;margin:4px 0 13px}.detail-stat{display:flex;gap:7px;margin:10px 0 15px}.stat{border:1px solid #343332;border-radius:8px;background:#1a1a1b;padding:9px 12px;flex:1}.stat strong{display:block;font-size:18px;line-height:1}.stat label{display:block;color:#94918a;font-size:8px;letter-spacing:1.1px;margin-top:5px;font-weight:700}.mode{display:flex;padding:3px;background:#242321;border-radius:9px;gap:3px;margin-bottom:12px}.mode button{border:0;background:transparent;color:#c5c2b8;flex:1;border-radius:7px;padding:8px;font-size:10px;font-weight:750;cursor:pointer}.mode button.active{background:var(--accent);color:#15130c}.exercise{border-top:1px solid #343333;padding:11px 1px 13px}.ex-top{display:flex;gap:10px;align-items:flex-start}.ex-num{font-size:12px;color:var(--accent);font-weight:850;margin-top:2px}.ex-text{flex:1}.ex-title{font-size:12px;font-weight:760;margin:0 0 4px}.ex-meta{font-size:10px;color:#b9b4a6;line-height:1.4}.ex-hint{font-size:10px;color:#777670;margin-top:5px}.sets{display:flex;gap:6px;margin-top:8px;margin-left:27px}.setbtn{border:1px solid #615b48;background:#24231f;color:#e7dfc5;border-radius:6px;min-width:53px;padding:5px 8px;font-size:9px;font-weight:740;cursor:pointer}.setbtn.done{background:#ded080;color:#12120e;border-color:#ded080}.small-note{margin-top:8px;border-left:2px solid var(--accent);padding:6px 0 6px 10px;font-size:10px;color:#b2ac9b;line-height:1.5}.muted-banner{padding:12px;margin:12px 0;background:#20201c;border:1px solid #454132;border-radius:7px;font-size:11px;line-height:1.5;color:#c9c6bd}
@media (max-width:740px){.shell{padding:7px;gap:6px}.emblem{display:none}.brandcopy h1{font-size:17px}.suptitle{font-size:7px}.topright{font-size:7px;gap:5px}.daystamp{display:none}.indicator{padding:5px}.board-caption{padding:6px 9px;min-height:28px;font-size:8px}.schedule th{height:30px;padding:4px 8px;font-size:12px}.schedule th small{display:none}.schedule td:first-child{font-size:10px;padding:5px 7px}.schedule td .session{padding:4px 7px;font-size:11px;gap:4px}.glyph{display:none}.board-footer{padding:5px 8px;font-size:7px}.board-footer span:last-child{display:none}.main.show-detail .detail{flex-basis:56%}.main.show-detail .schedule td:first-child{font-size:9px;padding:5px}.main.show-detail .schedule td .session{font-size:9px;padding:5px}.detail-scroll{padding:10px}.details-h{font-size:20px}.stat{padding:6px}.stat strong{font-size:16px}}

</style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="branding"><div class="emblem"><span>AM</span><i></i><span>PM</span></div><div class="brandcopy"><div class="suptitle">TRAINING PROTOCOL / v1.0</div><h1>AM/PM <b>SPLIT</b></h1></div></div>
      <div class="topright"><span class="daystamp" id="day-stamp">WEEKLY SCHEDULE</span><span class="indicator"><span class="dot"></span> ACTIVE PLAN</span></div>
    </header>
    <main class="main" id="main">
      <section class="board" id="board">
        <div class="board-caption"><span>WEEKLY SCHEDULE</span><span>SELECT A SESSION <span class="caption-arrow">↗</span></span></div>
        <div class="table-wrap">
          <table class="schedule" aria-label="AM/PM Split haftalık program">
            <colgroup><col class="day-col"/><col/><col/></colgroup>
            <thead><tr><th>GÜN</th><th><span class="sun">☀</span> AM <small>morning</small></th><th><span class="moon">☾</span> PM <small>evening</small></th></tr></thead>
            <tbody id="schedule-body"></tbody>
          </table>
        </div>
        <div class="board-footer"><span><i class="legend-dot"></i> 6 TRAINING DAYS · 1 FULL REST</span><span>ALL MAIN MUSCLE GROUPS · 2× / WEEK</span></div>
      </section>
      <aside class="detail" id="detail" aria-label="Seans detayları">
        <div class="detail-top"><button class="back" id="close-detail" type="button">← <span>WEEKLY PLAN</span></button><span class="micro">SESSION DETAILS</span></div>
        <div class="detail-scroll" id="detail-content"></div>
      </aside>
    </main>
  </div>
  <script>
/* AM/PM Split: local-only training protocol. No network or tracking. */
(function () {
'use strict';
const days = [
  ['Pazartesi','BICEPS','LEGS'],
  ['Salı','TRICEPS','BACK + REAR DELTS'],
  ['Çarşamba','SHOULDERS (SIDE)','CHEST PRESS + OHP + CORE'],
  ['Perşembe','BICEPS','LEGS'],
  ['Cuma','TRICEPS','BACK + REAR DELTS'],
  ['Cumartesi','SHOULDERS (SIDE)','CHEST PRESS + OHP + CORE'],
  ['Pazar','REST','REST']
];
const glyphs={'BICEPS':'◔','LEGS':'◢','TRICEPS':'◔','BACK + REAR DELTS':'♧','SHOULDERS (SIDE)':'◇','CHEST PRESS + OHP + CORE':'⬡','REST':'☷'};
const body=document.getElementById('schedule-body');
let active=null;
let gymMode=false;
const stored={};
function getSetKey(day,session,id,idx){return 'set_v1_'+day+'_'+session+'_'+id+'_'+idx;}
function getFlag(key){try{return localStorage.getItem(key)==='1'}catch(e){return stored[key]==='1'}}
function setFlag(key,v){try{localStorage.setItem(key,v?'1':'0')}catch(e){stored[key]=v?'1':'0'}}
function tagify(txt){return txt.replace(/REAR DELTS|CORE/g,match=>'<span class="mark">'+match+'</span>');}
const weekday=(new Date().getDay()+6)%7;
const stamp=document.getElementById('day-stamp');
stamp.textContent=days[weekday][0].toUpperCase()+' / WEEKLY SCHEDULE';
body.innerHTML=days.map((row,d)=>{
 const rest=d===6;const cell=(session,idx)=>`<td><button class="session" data-day="${d}" data-session="${idx}" ${rest?'disabled':''} aria-label="${row[0]} ${session}"><span class="glyph" aria-hidden="true">${glyphs[session]}</span><span class="mainname">${tagify(session)}</span></button></td>`;
 return `<tr class="${rest?'restrow':''}" data-row="${d}"><td>${row[0]}</td>${cell(row[1],0)}${cell(row[2],1)}</tr>`;
}).join('');
body.addEventListener('click',e=>{const btn=e.target.closest('button.session');if(!btn||btn.disabled)return;openDetail(Number(btn.dataset.day),Number(btn.dataset.session));});
document.getElementById('close-detail').addEventListener('click',closeDetail);
function closeDetail(){active=null;document.getElementById('main').classList.remove('show-detail');document.querySelectorAll('.session').forEach(el=>el.classList.remove('selected'));}
window.appBack=function(){closeDetail();return true};
function openDetail(day,session){active={day,session};gymMode=(session===1);document.querySelectorAll('.session').forEach(el=>el.classList.toggle('selected',Number(el.dataset.day)===day&&Number(el.dataset.session)===session));document.getElementById('main').classList.add('show-detail');renderDetail();}
const bicep=[
 {id:'warm',name:'Alternating Hammer Curl — Warm-up',sets:2,weight:'10 kg × 2 dumbbells',hint:'1 Sağ → 2 Sol → 3 Sağ → 4 Sol · Alternating, neutral grip'},
 {id:'hammer',name:'Alternating Hammer Curl — Working',sets:2,weight:'15–17.5 kg × 2 dumbbells',hint:'Aynı 1–2–3–4 sıralaması · Ağırlık günlük kuvvete göre'},
 {id:'curl',name:'Standing Dumbbell Curl',sets:2,weight:'≈15 kg dumbbells',hint:'Normal / supinated curl · Biceps önceliği'},
 {id:'reverse',name:'Reverse Barbell / EZ-Bar Curl',sets:2,weight:'Weight: variable',hint:'Üstten tutuş · Palms down · Brachioradialis / forearm'},
 {id:'preacher',name:'Machine Preacher Curl',sets:2,weight:'Weight: variable',hint:'Gym only · Home seansında uygulanmaz',gymOnly:true}
];
const others={
 'LEGS':{lead:'LOWER BODY / 2× WEEKLY',descr:'Mevcut legs protokolün: dört makine hareketi, her biri 2 çalışma seti; form bozulmadan failure’a yakın.',ex:['Leg Press','Hip Abductor','Hip Adductor','Seated Leg Curl']},
 'BACK + REAR DELTS':{lead:'PULL / 2× WEEKLY',descr:'Rear delts, ertesi sabah yerine aynı çekiş gününe alındı. Bilinen back hareketlerin aşağıda; diğer set ve tekrar ayrıntılarını birlikte tamamlarız.',ex:['Lat Pulldown','Seated Row','Rear Delts — machine / cable (details pending)']},
 'TRICEPS':{lead:'ARMS / 2× WEEKLY',descr:'Bu seansın ayrıntılarını daha sonra netleştireceğiz.',ex:['Triceps Pushdown','Overhead Triceps Extension']},
 'SHOULDERS (SIDE)':{lead:'SIDE DELTS / 2× WEEKLY',descr:'Arka omuzlar BACK gününe taşındı; burada yan omuz odaklı çalışma var. Ön omuz ayrıca çalışmıyor, press gününde yükleniyor.',ex:['Lateral Raise (sets pending)']},
 'CHEST PRESS + OHP + CORE':{lead:'PRESS + CORE / 2× WEEKLY',descr:'İlk olarak Chest Press, ardından Overhead Press, en son Core. Boyun nötr pozisyonda; ağrı/uyuşma varsa harekete devam etme.',ex:['Chest Press','Overhead Press','Ab Machine','Captain’s Chair Knee Raises','Forearm Plank']}
};
function renderDetail(){if(!active)return;const {day,session}=active;const ex=days[day][session];const root=document.getElementById('detail-content');if(ex==='BICEPS'){
 const list=bicep.filter(x=>gymMode||!x.gymOnly);const working=list.reduce((a,x)=>a+(x.id==='warm'?0:x.sets),0);const total=list.reduce((a,x)=>a+x.sets,0);
 root.innerHTML=`<div class="eyebrow">${days[day][0].toUpperCase()} / ${session?'PM':'AM'} SESSION</div><h2 class="details-h">BICEPS <span style="color:var(--accent)">PROTOCOL</span></h2><p class="desc">Twice weekly · Alternating 1–2–3–4 · Normal Curl before Reverse Curl</p>
 <div class="mode" role="group" aria-label="Konum"><button type="button" data-mode="home" class="${gymMode?'':'active'}">⌂ &nbsp; HOME</button><button type="button" data-mode="gym" class="${gymMode?'active':''}">▥ &nbsp; GYM</button></div>
 <div class="detail-stat"><div class="stat"><strong>${list.length}</strong><label>EXERCISES</label></div><div class="stat"><strong>${total}</strong><label>TOTAL SETS</label></div><div class="stat"><strong>${working}</strong><label>WORKING SETS</label></div></div>
 ${list.map((x,i)=>`<div class="exercise"><div class="ex-top"><span class="ex-num">${String(i+1).padStart(2,'0')}</span><div class="ex-text"><div class="ex-title">${x.name}</div><div class="ex-meta">${x.sets} sets <span style="color:var(--accent)">•</span> ${x.weight}</div><div class="ex-hint">${x.hint}</div></div></div><div class="sets">${Array.from({length:x.sets},(_,j)=>{let key=getSetKey(day,session,x.id,j);return `<button type="button" class="setbtn ${getFlag(key)?'done':''}" data-setkey="${key}">${getFlag(key)?'✓ ':''}SET ${j+1}</button>`}).join('')}</div></div>`).join('')}
 <div class="small-note">Warm-up: 2 sets × 10 kg. Working Hammer: 2 sets × 15–17.5 kg. Normal Curl, Reverse Curl ve (gym’de) Preacher Curl: 2’şer set. Tekrar sayıları henüz sabitlenmedi.</div>`;
 root.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{gymMode=btn.dataset.mode==='gym';renderDetail();}));
 root.querySelectorAll('[data-setkey]').forEach(btn=>btn.addEventListener('click',()=>{const k=btn.dataset.setkey;setFlag(k,!getFlag(k));btn.classList.toggle('done',getFlag(k));btn.textContent=(getFlag(k)?'✓ ':'')+'SET '+(Array.from(btn.parentNode.children).indexOf(btn)+1);}));
 }else{const spec=others[ex]||{lead:'PROTOCOL',descr:'Bu seansın ayrıntıları sonraki sürümde eklenecek.',ex:[]};root.innerHTML=`<div class="eyebrow">${days[day][0].toUpperCase()} / ${session?'PM':'AM'} SESSION</div><h2 class="details-h">${ex}</h2><p class="desc">${spec.lead}</p><div class="muted-banner">${spec.descr}</div>${spec.ex.map((x,i)=>`<div class="exercise"><div class="ex-top"><span class="ex-num">${String(i+1).padStart(2,'0')}</span><div class="ex-text"><div class="ex-title">${x}</div>${ex==='LEGS'?'<div class="ex-meta">2 working sets · near failure</div>':'<div class="ex-hint">Sets / weight: to be confirmed</div>'}</div></div></div>`).join('')}<div class="small-note">Bu oturumun hareketlerini ve ağırlıklarını senin gerçek protokolüne göre ekleyeceğiz; eksik bilgileri tahmin etmiyoruz.</div>`;}
 root.scrollTop=0;
}
})();

</script>
</body>
</html>
